version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nextblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nextblog
      MYSQL_USER: nextblog
      MYSQL_PASSWORD: nextblogpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: nextblog-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://nextblog:nextblogpassword@mysql:3306/nextblog
      AUTH_SECRET: your-secret-key-generate-with-openssl-rand-base64-32
      AUTH_URL: http://localhost:3000
    depends_on:
      - mysql
    volumes:
      - ./prisma:/app/prisma

volumes:
  mysql_data:
